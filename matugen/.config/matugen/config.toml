[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.chromium]
input_path = '~/.config/matugen/templates/chromium/color.json'
output_path = '/etc/chromium/policies/managed/color.json'
post_hook = 'pgrep -x chromium >/dev/null && chromium --refresh-platform-policy --no-startup-window &>/dev/null || true'

# kitty is included last in kitty.conf so it overrides the Omarchy theme palette.
# SIGUSR1 makes a running kitty re-read its config; `|| true` keeps matugen from
# reporting a failure when no kitty is open.
[templates.kitty]
input_path = '~/.config/matugen/templates/kitty/colors.conf'
output_path = '~/.config/kitty/colors-matugen.conf'
post_hook = 'pkill -USR1 -x kitty 2>/dev/null || true'

# Iris re-reads its theme file on every render, so no post_hook is needed —
# open shells pick the new colors up on the next keystroke.
[templates.iris]
input_path = '~/.config/matugen/templates/iris/theme.toml'
output_path = '~/.config/iris/theme.toml'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/hyprland/colors.lua'

[templates.hyprland_borders]
input_path = '~/.config/matugen/templates/hyprland/border-colors.conf'
output_path = '~/.config/hypr/colors-ii.conf'
post_hook = 'hyprctl reload'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.ncspot]
input_path = '~/.config/matugen/templates/ncspot/config.toml'
output_path = '~/.config/ncspot/config.toml'

[templates.zen]
input_path = '~/.config/matugen/templates/zen/zen-matugen.css'
output_path = '~/.config/zen/rrc9mbf1.Default (release)/chrome/zen-matugen.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'
