# Generated by matugen from the current wallpaper. Do not edit by hand.
#
# Iris' suggestion overlay. This has to be regenerated per wallpaper because Iris
# accepts hex only — it can't use ANSI names the way ~/.zsh_fzf_theme does.
#
# Every value below is the same Material You token that the kitty template maps
# the corresponding ANSI slot to, so the dropdown matches the terminal palette
# exactly rather than approximately:
#
#   outline               = color8   fzf borders, info, footer
#   surface_container_high = color0  fzf bg+ (selected row)
#   tertiary              = color5   fzf pointer / marker
#   secondary_fixed       = color14  fzf hl+ (matched text)
#   on_surface            = color15 / foreground
#   surface               = background
#
# Iris re-reads this file on every render, so a wallpaper change recolors the
# dropdown in shells that are already open.

# overlay border — same token as color8, like every fzf border
border = "{{colors.outline.default.hex}}"

# selected marker and icon — like fzf's pointer/marker
accent = "{{colors.tertiary.default.hex}}"

# unselected icons
muted = "{{colors.outline.default.hex}}"

# default row text
text = "{{colors.on_surface.default.hex}}"
text_sel = "{{colors.on_surface.default.hex}}"

# footer shortcut keys — like the keys _fzf_footer emits
key = "{{colors.on_surface.default.hex}}"

# matched text. fzf splits this in two (hl unselected, hl+ selected); Iris has a
# single key for both states, so take the brighter of the pair — it has to stay
# legible on sel_bg as well as on the terminal background.
match = "{{colors.secondary_fixed.default.hex}}"

# description text
desc = "{{colors.outline.default.hex}}"
desc_sel = "{{colors.on_surface.default.hex}}"

# selected row background — like fzf's bg+
sel_bg = "{{colors.surface_container_high.default.hex}}"

# text inside a selected category pill: it sits on a saturated *_sel background,
# so it takes the terminal background rather than a foreground color
sel_text = "{{colors.surface.default.hex}}"

# scroll counter — like fzf's info line
scroll_info = "{{colors.outline.default.hex}}"

# inline ghost text. The one place that uses outline_variant instead of outline:
# it trails the command you are typing and should stay clearly subordinate to it.
ghost_text = "{{colors.outline_variant.default.hex}}"

# Category pills. The unselected background is the same neutral for all three —
# the selected color is what tells them apart, and the three map onto the same
# tokens as ANSI blue / cyan / magenta.
sys = "{{colors.surface_container_high.default.hex}}"
sys_sel = "{{colors.primary.default.hex}}"

hist = "{{colors.surface_container_high.default.hex}}"
hist_sel = "{{colors.secondary.default.hex}}"

alias = "{{colors.surface_container_high.default.hex}}"
alias_sel = "{{colors.tertiary.default.hex}}"
