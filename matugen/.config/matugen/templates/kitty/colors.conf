# Generated by matugen from the current wallpaper. Do not edit by hand.
#
# kitty.conf includes ~/.config/omarchy/current/theme/kitty.conf first and this
# file last, so everything defined here wins. Anything NOT defined here keeps the
# Omarchy theme's value — that fall-through is deliberate and is what keeps
# green and yellow meaningful (see the note further down).
#
# fzf needs no counterpart to this file: ~/.zsh_fzf_theme is written in ANSI
# color names rather than hex, so it re-resolves through whatever palette kitty
# currently has. Recoloring kitty recolors the fzf pickers for free.

background            {{colors.surface.default.hex}}
foreground            {{colors.on_surface.default.hex}}

cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}

selection_background  {{colors.secondary_container.default.hex}}
selection_foreground  {{colors.on_secondary_container.default.hex}}

# Window borders. kitty.conf hardcodes a Tokyo Night blue for these; because
# this file is included after it, these take over.
active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline_variant.default.hex}}
active_tab_background {{colors.primary.default.hex}}
active_tab_foreground {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}

# Neutrals. color0 is the selected-row background in fzf (bg+) and Iris; color8
# is every fzf border plus its info and footer lines, so it takes `outline`
# rather than the dimmer `outline_variant` — it has to carry small text, not
# just rules.
color0  {{colors.surface_container_high.default.hex}}
color8  {{colors.outline.default.hex}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}

# Cool hues, harmonized with the wallpaper.
color1  {{colors.error.default.hex}}
color9  {{colors.on_error_container.default.hex}}
color4  {{colors.primary.default.hex}}
color12 {{colors.primary_fixed.default.hex}}
color5  {{colors.tertiary.default.hex}}
color13 {{colors.tertiary_fixed.default.hex}}
color6  {{colors.secondary.default.hex}}
color14 {{colors.secondary_fixed.default.hex}}

# color2/color3 (and their bright pairs color10/color11) are deliberately absent.
# Material You derives every hue from one source color, so a generated "green"
# would only be the wallpaper's hue rotated — and green and yellow are the two
# slots that carry meaning rather than style: `git diff` additions, `ls` file
# types, compiler warnings, nvim diagnostics. Leaving them undefined lets the
# Omarchy theme's values fall through, so they stay green and yellow.
