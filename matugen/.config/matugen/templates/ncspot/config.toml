# Spotify access points are unreachable on their default port 4070 from this
# network; 443 carries the same protocol and connects. Without this ncspot
# hangs silently at startup with a blank screen.
ap_port = 443

[theme]
title = "{{colors.primary.default.hex}}"
highlight = "{{colors.on_primary.default.hex}}"
highlight_bg = "{{colors.primary.default.hex}}"
search_match = "{{colors.tertiary.default.hex}}"
playing = "#1db954"
playing_selected = "#1db954"
statusbar = "#1db954"
statusbar_progress = "#1db954"

[keybindings]
"Space" = "play"
