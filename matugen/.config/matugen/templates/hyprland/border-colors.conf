# Auto-generated by matugen from the current wallpaper (ii Material palette).
# Sourced from ~/.config/hypr/looknfeel.conf so it overrides the omarchy theme,
# keeping Hyprland window borders in sync with the illogical-impulse shell colors.

general {
    col.active_border = rgb({{colors.primary.default.hex_stripped}})
    col.inactive_border = rgb({{colors.surface_container_high.default.hex_stripped}})
}

group {
    col.border_active = rgb({{colors.primary.default.hex_stripped}})
    col.border_inactive = rgb({{colors.surface_container_high.default.hex_stripped}})
}
