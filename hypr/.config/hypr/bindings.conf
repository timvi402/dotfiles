# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

bindd = SUPER, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"
bindd = SUPER SHIFT, T, Teams, exec, omarchy-launch-or-focus-webapp Teams "https://cloud.teams.microsoft/"

# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

# Unbind fullscreen from SUPER+F
unbind = SUPER, F

bindd = SUPER, E, Yazi, exec, $terminal zsh -c "yazi"
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPAC Omarchy menu, exec, omarchy-menu
bindd = SUPER, L, Lock, exec, hyprlock
bindd = SUPER, period, Symbols, exec, walker --provider symbols

# Unbind default PRINT (was: Screenshot with editing)
unbind = , PRINT
# Rebind to Quickshell (ii) region snip flow (grim + region selector)
bindd = , PRINT, Screenshot region (quickshell), exec, qs -c ii ipc call region screenshot

# Quickshell (ii) wallpaper selector
bindd = CTRL SUPER, D, Wallpaper selector, global, quickshell:wallpaperSelectorToggle

# Wallpaper selector (override omarchy's default Wifi controls on SUPER CTRL W)
unbind = SUPER CTRL, W
bindd = SUPER CTRL, W, Wallpaper selector, exec, /usr/bin/qs ipc -c ii call wallpaperSelector toggle
