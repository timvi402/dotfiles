include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size        12.0

# Window
background_opacity 0.8
window_padding_width 14
hide_window_decorations yes
# Negative, not 0: only confirm when a window has a command actually running.
# Shell integration is on (no-cursor disables the cursor shaping only, not the
# integration), so windows sitting at an idle prompt are not counted and close
# without a prompt. A stray Super+Q over something long-running asks first.
confirm_os_window_close -1

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
map ctrl+shift+h show_scrollback
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down
map alt+left neighboring_window left
map alt+right neighboring_window right
# Ctrl+å sends CSI-u sequence for the zsh claude-launch widget (å = U+00E5 = 229)
map ctrl+å send_text all \x1b[229;5u

# Allow remote access
allow_remote_control yes

# Scrollback pager (copy mode with nvim)
#
# The rendering lives in scrollback.lua, which parses kitty's SGR escapes into
# extmarks so the buffer holds plain text. Every flag here is load-bearing:
#
#   -n          No swapfile. The buffer nvim fills from stdin is UNNAMED, and
#               nvim keys an unnamed buffer's swapfile on the CWD -- so every
#               pager opened from the same directory wanted the same
#               ~/.local/state/nvim/swap/%home%timmy-xlent.swp and hit E325.
#               Instances killed with the overlay window left the file behind,
#               so the collision was permanent once one leaked.
#   -i NONE     No shada. A throwaway view shouldn't record marks or jumps.
#   --noplugin  -u <file> (unlike -u NONE) would otherwise still load plugins.
#   -           Read the scrollback from stdin INTO the buffer. The previous
#               command omitted this, so the text never reached nvim at all --
#               it was echoed through `:terminal cat`, leaving the buffer
#               holding the emulator's screen. That is why copied text came out
#               hard-wrapped at the window width.
scrollback_pager nvim -n -i NONE --noplugin -u ~/.config/kitty/scrollback.lua -

# Aesthetics
cursor_shape block
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1
shell_integration no-cursor
enable_audio_bell no
window_border_width 2pt
active_border_color #7aa2f7
inactive_border_color #414868
draw_minimal_borders yes

# Fades the text of inactive *splits* — Hyprland handles focus at the OS-window
# level separately, via inactive_opacity 0.25 in ~/.config/hypr/looknfeel.conf.
#
# Known limit, not worth fixing: this fades glyphs only, and kitty has no
# equivalent for cell backgrounds. So in an inactive split the powerline prompt
# fades unevenly — the chips keep their full background color while the arrow
# closing each one, which is a glyph tinted with that same color, drops to 30%
# and detaches from the chip it belongs to. Nothing in kitty can fade a cell
# background; the only way to make the whole prompt fade together would be a
# prompt with no chip backgrounds at all.
inactive_text_alpha 0.30

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Wallpaper-derived palette, written by matugen on every wallpaper change.
#
# Included LAST so it overrides both the Omarchy theme palette at the top of this
# file and the hardcoded border colors above. Slots it leaves undefined — green
# and yellow — keep falling through from the Omarchy theme, which is what keeps
# `git diff` and `ls` readable.
#
# globinclude rather than include: on a machine where matugen has not run yet the
# file simply does not exist, and a glob with no match is a no-op instead of a
# startup warning.
globinclude colors-matugen.conf

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
